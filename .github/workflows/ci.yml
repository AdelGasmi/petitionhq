name: CI

# Gate every PR on typecheck + lint + the full test suite against a real Postgres.
# (P0.1 + P1.1 from codebase_refactor.md — lint is now a hard gate; the noisy
# react/no-unescaped-entities rule is disabled in .eslintrc.json, real errors fixed.)

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: petition
          POSTGRES_PASSWORD: petition_dev
          POSTGRES_DB: petition
        # Tests connect to localhost:5433 (matches the dev compose port).
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U petition"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://petition:petition_dev@localhost:5433/petition
      TEST_DATABASE_URL: postgresql://petition:petition_dev@localhost:5433/petition
      # Auth helpers throw if SESSION_SECRET is unset; value is irrelevant in tests.
      SESSION_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npx prisma migrate deploy

      - name: Test
        run: npx vitest run --coverage

      # P1.5 — surface coverage (lib/**) on every run. No threshold yet; this is
      # observability, not a gate. Renders in the run's Summary tab.
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            try {
              const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              const md = ["### Coverage — lib/** (verification excluded on CI)", "",
                "| Metric | % | Covered |", "|---|---|---|",
                row("lines"), row("statements"), row("functions"), row("branches")].join("\n");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
              console.log(md);
            } catch (e) { console.log("No coverage summary:", e.message); }
          '
