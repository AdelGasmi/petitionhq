services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petition
      POSTGRES_PASSWORD: petition_dev
      POSTGRES_DB: petition
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petition"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Email catcher — ARM64-native replacement for mailhog
  # View all sent emails at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP (matches SMTP_HOST/PORT in .env.local)
      - "8025:8025"   # Web UI

  # S3-compatible local storage — mirrors Cloudflare R2
  # Console: http://localhost:9001  (user: minioadmin / minioadmin)
  # API:     http://localhost:9000
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the two buckets on first start (mirrors prod bucket names)
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/petitionhq-secure-data;
        mc mb --ignore-existing local/petitionhq-public-assets;
        mc anonymous set public local/petitionhq-public-assets;
        echo 'Buckets ready';
      "

volumes:
  postgres_data:
  minio_data:
