services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-petition}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petition}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: petition-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-petition}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-petition}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      # Storage — dual-bucket R2
      STORAGE_BACKEND: r2
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET_SECURE: ${R2_BUCKET_SECURE}
      R2_BUCKET_PUBLIC: ${R2_BUCKET_PUBLIC}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_CASE_MGMT_SEAT: ${STRIPE_PRICE_CASE_MGMT_SEAT:-}
      STRIPE_PRICE_CASE_NIW: ${STRIPE_PRICE_CASE_NIW:-}
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LMSTUDIO_URL: ${LMSTUDIO_URL:-}
      # Cron
      CRON_SECRET: ${CRON_SECRET}
      # Turnstile CAPTCHA
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # ORCID OAuth (Sign in with ORCID — gates the identity_confirmed tier).
      # Only the two secrets live in .env; the redirect URI + env have safe defaults.
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI:-https://petitionhq.us/api/auth/orcid/callback}
      ORCID_ENV: ${ORCID_ENV:-production}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
